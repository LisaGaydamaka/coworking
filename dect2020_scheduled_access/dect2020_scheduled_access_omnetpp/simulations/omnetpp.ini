[General]
network = dect2020scheduledaccess.DectScheduledAccessNetwork
cmdenv-express-mode = true
cmdenv-status-frequency = 10s
result-dir = results

*.queue.frameDuration = 10ms
*.queue.meanType1ServiceTime = 0.4166666667ms
*.queue.deriveDectParametersFromD = true
*.queue.deriveLambdaFromRho = true
*.queue.warmupCompletedPackets = 200000
*.queue.targetCompletedPackets = 1000000
*.queue.recordVectors = false
*.queue.rngIndex = 0

# The three Phase-2 configurations reproduce the analytical/DES grid used in the
# manuscript work: D in {6,10,20}, r in {5,20,50}, and load at
# {0.5,1.0,1.5} times rho_sat, with 10 independent repetitions per point.

[Config Phase2_D6]
repeat = 10
seed-set = ${repetition}
*.queue.D = 6
*.queue.r = ${r=5,20,50}
# D=6 => L=4, mF=8.3333333333 ms, rho_sat=1/6.
*.queue.rho = ${rho=0.083333333333,0.166666666667,0.250000000000}

[Config Phase2_D10]
repeat = 10
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = ${r=5,20,50}
# D=10 => L=2, mF=9 ms, rho_sat=0.084745762712.
*.queue.rho = ${rho=0.042372881356,0.084745762712,0.127118644068}

[Config Phase2_D20]
repeat = 10
seed-set = ${repetition}
*.queue.D = 20
*.queue.r = ${r=5,20,50}
# D=20 => L=1, mF=9.5 ms, rho_sat=0.042016806723.
*.queue.rho = ${rho=0.021008403361,0.042016806723,0.063025210084}

[Config Baseline]
repeat = 10
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = 30
*.queue.rho = 0.084745762712

[Config TailExample]
# Vector recording is intentionally off in the Phase-2 grid for speed. Enable it
# here when packet-level delay samples are needed for the later tail-latency phase.
repeat = 1
seed-set = 0
*.queue.D = 10
*.queue.r = 30
*.queue.rho = 0.084745762712
*.queue.recordVectors = true
*.queue.targetCompletedPackets = 2000000


# ---------------------------------------------------------------------------
# Phase 3: high-load audit of Theorem 2 and Corollary 1.
# These configurations are intentionally lighter than the Phase-2 grid:
# 20,000 warm-up type-1 completions, 50,000 measured type-1 completions,
# and 3 independent repetitions per parameter point.
# ---------------------------------------------------------------------------

[Config Phase3_D6]
result-dir = results_phase3
repeat = 3
seed-set = ${repetition}
*.queue.D = 6
*.queue.r = ${r=5,30,50}
*.queue.rho = ${rho=0.833333333333,1.666666666667,3.333333333333,8.333333333333}
*.queue.warmupCompletedPackets = 20000
*.queue.targetCompletedPackets = 50000

[Config Phase3_D10]
result-dir = results_phase3
repeat = 3
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = ${r=5,30,50}
*.queue.rho = ${rho=0.423728813559,0.847457627119,1.694915254237,4.237288135593}
*.queue.warmupCompletedPackets = 20000
*.queue.targetCompletedPackets = 50000

[Config Phase3_D20]
result-dir = results_phase3
repeat = 3
seed-set = ${repetition}
*.queue.D = 20
*.queue.r = ${r=5,30,50}
*.queue.rho = ${rho=0.210084033613,0.420168067227,0.840336134454,2.100840336134}
*.queue.warmupCompletedPackets = 20000
*.queue.targetCompletedPackets = 50000

# Corollary 1, buffer-size comparison at fixed DECT mapping (D=10, L=2, mF=9 ms)
# and rho/rho_sat = 50.
[Config Phase3_CorR]
result-dir = results_phase3
repeat = 3
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = ${r=5,10,20,30,40,50}
*.queue.rho = 4.237288135593
*.queue.warmupCompletedPackets = 20000
*.queue.targetCompletedPackets = 50000

# Corollary 1, abstract L-comparison with mF fixed at 9 ms and r=20.
# L and mF are deliberately decoupled here because the corollary treats them
# as independent mathematical parameters.
[Config Phase3_CorL1]
result-dir = results_phase3
repeat = 3
seed-set = ${repetition}
*.queue.deriveDectParametersFromD = false
*.queue.D = 10
*.queue.L = 1
*.queue.type2ServiceTime = 9ms
*.queue.r = 20
*.queue.rho = 2.212389380531
*.queue.warmupCompletedPackets = 20000
*.queue.targetCompletedPackets = 50000

[Config Phase3_CorL2]
extends = Phase3_CorL1
*.queue.L = 2
*.queue.rho = 4.237288135593

[Config Phase3_CorL3]
extends = Phase3_CorL1
*.queue.L = 3
*.queue.rho = 6.097560975610

[Config Phase3_CorL4]
extends = Phase3_CorL1
*.queue.L = 4
*.queue.rho = 7.812500000000
