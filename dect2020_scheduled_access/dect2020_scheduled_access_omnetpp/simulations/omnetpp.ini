[General]
network = dect2020scheduledaccess.DectScheduledAccessNetwork
cmdenv-express-mode = true
cmdenv-status-frequency = 10s
result-dir = results

*.queue.frameDuration = 10ms
*.queue.meanType1ServiceTime = 0.4166666667ms
*.queue.deriveDectParametersFromD = true
*.queue.deriveLambdaFromRho = true
*.queue.warmupCompletedPackets = 200000
*.queue.targetCompletedPackets = 1000000
*.queue.recordVectors = false
*.queue.rngIndex = 0

# The three Phase-2 configurations reproduce the analytical/DES grid used in the
# manuscript work: D in {6,10,20}, r in {5,20,50}, and load at
# {0.5,1.0,1.5} times rho_sat, with 10 independent repetitions per point.

[Config Phase2_D6]
repeat = 10
seed-set = ${repetition}
*.queue.D = 6
*.queue.r = ${r=5,20,50}
# D=6 => L=4, mF=8.3333333333 ms, rho_sat=1/6.
*.queue.rho = ${rho=0.083333333333,0.166666666667,0.250000000000}

[Config Phase2_D10]
repeat = 10
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = ${r=5,20,50}
# D=10 => L=2, mF=9 ms, rho_sat=0.084745762712.
*.queue.rho = ${rho=0.042372881356,0.084745762712,0.127118644068}

[Config Phase2_D20]
repeat = 10
seed-set = ${repetition}
*.queue.D = 20
*.queue.r = ${r=5,20,50}
# D=20 => L=1, mF=9.5 ms, rho_sat=0.042016806723.
*.queue.rho = ${rho=0.021008403361,0.042016806723,0.063025210084}

[Config Baseline]
repeat = 10
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = 30
*.queue.rho = 0.084745762712

[Config TailExample]
# Vector recording is intentionally off in the Phase-2 grid for speed. Enable it
# here when packet-level delay samples are needed for the later tail-latency phase.
repeat = 1
seed-set = 0
*.queue.D = 10
*.queue.r = 30
*.queue.rho = 0.084745762712
*.queue.recordVectors = true
*.queue.targetCompletedPackets = 2000000
