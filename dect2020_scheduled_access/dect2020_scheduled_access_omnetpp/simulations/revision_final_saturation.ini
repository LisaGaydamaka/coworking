# Final 5-case near-saturation audit of original, UNMODIFIED OMNeT++
# vacation queue. 20 independent repetitions per case; 1,000,000 completed
# packets for warm-up and 5,000,000 measured admitted completions per run.
# NOTE: seed sets 0...19 match 10 original seeds plus 10 additional ones,
# enabling a paired warm-up/measurement comparison, rather than providing
# 20 new seeds independent of the historical experiment.
[General]
network = dect2020scheduledaccess.DectScheduledAccessNetwork
cmdenv-express-mode = true
cmdenv-status-frequency = 30s
result-dir = results_revision_final_saturation
*.queue.frameDuration = 10ms
*.queue.meanType1ServiceTime = 0.4166666667ms
*.queue.deriveDectParametersFromD = true
*.queue.deriveLambdaFromRho = true
*.queue.recordVectors = false
*.queue.recordTailStatistics = false
*.queue.warmupCompletedPackets = 1000000
*.queue.targetCompletedPackets = 5000000
*.queue.rngIndex = 0

[Config FinalSat_D10R20]
repeat = 20
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = 20
*.queue.rho = 0.084745762712

[Config FinalSat_D10R50]
repeat = 20
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = 50
*.queue.rho = 0.084745762712

[Config FinalSat_D20R5]
repeat = 20
seed-set = ${repetition}
*.queue.D = 20
*.queue.r = 5
*.queue.rho = 0.042016806723

[Config FinalSat_D20R20]
repeat = 20
seed-set = ${repetition}
*.queue.D = 20
*.queue.r = 20
*.queue.rho = 0.042016806723

[Config FinalSat_D20R50]
repeat = 20
seed-set = ${repetition}
*.queue.D = 20
*.queue.r = 50
*.queue.rho = 0.042016806723
