# Corrected 10-ms-cycle sensitivity of the original vacation queue.
# Uses the UNMODIFIED published ScheduledAccessQueue C++ model.
# D=10 L=2, B=10/24ms, F=10-2*(10/24)=9.1666666667ms.
[General]
network = dect2020scheduledaccess.DectScheduledAccessNetwork
cmdenv-express-mode = true
cmdenv-status-frequency = 30s
result-dir = results_revision_variability
*.queue.frameDuration = 10ms
*.queue.D = 10
*.queue.r = 30
*.queue.meanType1ServiceTime = 0.4166666667ms
*.queue.deriveDectParametersFromD = false
*.queue.L = 2
*.queue.type2ServiceTime = 9.1666666667ms
*.queue.deriveLambdaFromRho = true
*.queue.recordVectors = false
*.queue.recordTailStatistics = true
*.queue.warmupCompletedPackets = 200000
*.queue.targetCompletedPackets = 1000000
*.queue.rngIndex = 0

[Config RevisionVar_Deterministic]
repeat = 10
seed-set = ${repetition}
*.queue.rho = ${rho=0.066666666667,0.083333333333,0.1}
*.queue.type1ServiceDistribution = "deterministic"

[Config RevisionVar_Exponential]
repeat = 10
seed-set = ${repetition}
*.queue.rho = ${rho=0.066666666667,0.083333333333,0.1}
*.queue.type1ServiceDistribution = "exponential"

[Config RevisionVar_Hyperexponential]
repeat = 10
seed-set = ${repetition}
*.queue.rho = ${rho=0.066666666667,0.083333333333,0.1}
*.queue.type1ServiceDistribution = "hyperexponential"
*.queue.type1ServiceSCV = 4
