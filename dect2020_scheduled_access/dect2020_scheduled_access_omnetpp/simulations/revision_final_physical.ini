# Final independent slot-synchronous checks for missing manuscript Table 4 D values.
# r=30, 10 independent reps per point, 200k warm-up, 1m measured each.
# One packet per assigned slot; identical 24-slot, 10ms frame model as prior runs.
[General]
network = dect2020scheduledaccess.FixedSlotNetwork
cmdenv-express-mode = true
cmdenv-status-frequency = 30s
result-dir = results_revision_final_physical
*.queue.frameDuration = 10ms
*.queue.totalSlots = 24
*.queue.availableSlots = 24
*.queue.meanType1ServiceTime = 0.4166666667ms
*.queue.slotLayout = "contiguous"
*.queue.trafficModel = "poisson"
*.queue.trafficBatchSize = 4
*.queue.deriveLambdaFromRho = false
*.queue.rngIndex = 0
*.queue.recordTailStatistics = true
*.queue.warmupCompletedPackets = 200000
*.queue.targetCompletedPackets = 1000000

# The frame-aligned abstract model predicts approximately 1/5/10% blocking
# at lambda ~= 1.16095243 / 1.25403029 / 1.33201449 packets/ms.
[Config FinalPhysical_D2]
repeat = 10
seed-set = ${repetition}
*.queue.D = 2
*.queue.r = 30
*.queue.lambdaPerMs = ${lambdaPerMs=1.160952429723,1.254030294175,1.332014486309}

# D=13 and D=24 both have L=1; under this idealized tagged-PT model they
# have identical repeated one-slot-per-frame calendars, hence predictions.
[Config FinalPhysical_D13]
repeat = 10
seed-set = ${repetition}
*.queue.D = 13
*.queue.r = 30
*.queue.lambdaPerMs = ${lambdaPerMs=0.098443918923,0.104979509711,0.111092379637}

[Config FinalPhysical_D24]
repeat = 10
seed-set = ${repetition}
*.queue.D = 24
*.queue.r = 30
*.queue.lambdaPerMs = ${lambdaPerMs=0.098443918923,0.104979509711,0.111092379637}
