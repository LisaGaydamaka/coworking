# Major-revision independent fixed-slot benchmark; legacy omnetpp.ini is unchanged.
[General]
network = dect2020scheduledaccess.FixedSlotNetwork
cmdenv-express-mode = true
cmdenv-status-frequency = 30s
result-dir = results_revision
*.queue.frameDuration = 10ms
*.queue.totalSlots = 24
*.queue.availableSlots = 24
*.queue.meanType1ServiceTime = 0.4166666667ms
*.queue.slotLayout = "contiguous"
*.queue.trafficModel = "poisson"
*.queue.trafficBatchSize = 4
*.queue.deriveLambdaFromRho = false
*.queue.rngIndex = 0
*.queue.recordTailStatistics = false
*.queue.warmupCompletedPackets = 200000
*.queue.targetCompletedPackets = 1000000

[Config Smoke]
repeat = 2
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = 30
*.queue.lambdaPerMs = ${lambdaPerMs=0.1,0.2,0.3}
*.queue.warmupCompletedPackets = 1000
*.queue.targetCompletedPackets = 6000
*.queue.recordTailStatistics = true

# 27 main groups, 10 repetitions, physical load factors 0.5,1,1.5.
[Config Revision_D6]
repeat = 10
seed-set = ${repetition}
*.queue.D = 6
*.queue.r = ${r=5,20,50}
*.queue.lambdaPerMs = ${lambdaPerMs=0.2,0.4,0.6}

[Config Revision_D10]
repeat = 10
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = ${r=5,20,50}
*.queue.lambdaPerMs = ${lambdaPerMs=0.1,0.2,0.3}

[Config Revision_D20]
repeat = 10
seed-set = ${repetition}
*.queue.D = 20
*.queue.r = ${r=5,20,50}
*.queue.lambdaPerMs = ${lambdaPerMs=0.05,0.1,0.15}

[Config Revision_Tail]
repeat = 10
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = 30
*.queue.lambdaPerMs = ${lambdaPerMs=0.1,0.14,0.16,0.18,0.2,0.22,0.24,0.3,0.4,1.0}
*.queue.recordTailStatistics = true

[Config Revision_Distributed]
repeat = 5
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = 30
*.queue.lambdaPerMs = ${lambdaPerMs=0.1,0.18,0.2,0.24,0.3}
*.queue.slotLayout = "distributed"
*.queue.recordTailStatistics = true

[Config Revision_Overhead]
repeat = 5
seed-set = ${repetition}
*.queue.D = ${D=6,10,20}
*.queue.r = 30
*.queue.availableSlots = 22
*.queue.lambdaPerMs = ${lambdaPerMs=0.05,0.1,0.2,0.3}
*.queue.recordTailStatistics = true

[Config Revision_Traffic]
repeat = 5
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = 30
*.queue.trafficModel = "poisson"
*.queue.lambdaPerMs = ${lambdaPerMs=0.1,0.18,0.2,0.24}
*.queue.recordTailStatistics = true

[Config Revision_DimensioningD6]
repeat = 5
seed-set = ${repetition}
*.queue.D = 6
*.queue.r = 30
*.queue.lambdaPerMs = ${lambdaPerMs=0.39245,0.4196,0.4443}
*.queue.recordTailStatistics = true

[Config Revision_DimensioningD10]
repeat = 5
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = 30
*.queue.lambdaPerMs = ${lambdaPerMs=0.19670,0.20992,0.22218}
*.queue.recordTailStatistics = true

[Config Revision_DimensioningD20]
repeat = 5
seed-set = ${repetition}
*.queue.D = 20
*.queue.r = 30
*.queue.lambdaPerMs = ${lambdaPerMs=0.09844,0.10498,0.11109}
*.queue.recordTailStatistics = true

[Config Revision_Trade]
repeat = 5
seed-set = ${repetition}
*.queue.D = 10
*.queue.r = ${r=1,5,10,20,30,50}
*.queue.lambdaPerMs = ${lambdaPerMs=0.16,0.2,0.24}
*.queue.recordTailStatistics = true

# Explicit named traffic variants make string parameters unambiguous in OMNeT++.
[Config Revision_Traffic_Poisson]
extends = Revision_Traffic
*.queue.trafficModel = "poisson"

[Config Revision_Traffic_Periodic]
extends = Revision_Traffic
*.queue.trafficModel = "periodic"

[Config Revision_Traffic_Synchronized]
extends = Revision_Traffic
*.queue.trafficModel = "synchronized"

[Config Revision_Traffic_Bursty]
extends = Revision_Traffic
*.queue.trafficModel = "bursty"
