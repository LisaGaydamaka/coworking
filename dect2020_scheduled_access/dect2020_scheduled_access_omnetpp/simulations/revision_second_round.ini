# Second-round peer-review checks (separate from all first-round runs).
# 5 independent seed-set repetitions, 100k warm-up, 400k measured completions.
# D=2 low-load checks compare contiguous vs distributed slot calendars.
# Deterministic-threshold checks use EXACT rates from the r=30,
# frame-aligned deterministic analytical contour table (not exponential).
[General]
network = dect2020scheduledaccess.FixedSlotNetwork
cmdenv-express-mode = true
cmdenv-status-frequency = 30s
result-dir = results_revision_second_round
*.queue.frameDuration = 10ms
*.queue.totalSlots = 24
*.queue.availableSlots = 24
*.queue.meanType1ServiceTime = 0.4166666667ms
*.queue.slotLayout = "contiguous"
*.queue.trafficModel = "poisson"
*.queue.trafficBatchSize = 4
*.queue.deriveLambdaFromRho = false
*.queue.rngIndex = 0
*.queue.recordTailStatistics = false
*.queue.warmupCompletedPackets = 100000
*.queue.targetCompletedPackets = 400000

[Config Round2_Lowload_D2_Contiguous]
repeat = 5
seed-set = ${repetition}
*.queue.D = 2
*.queue.r = 30
*.queue.lambdaPerMs = ${lambdaPerMs=0.24,0.6}

[Config Round2_Lowload_D2_Distributed]
extends = Round2_Lowload_D2_Contiguous
*.queue.slotLayout = "distributed"

[Config Round2_Deterministic_D2]
repeat = 5
seed-set = ${repetition}
*.queue.D = 2
*.queue.r = 30
*.queue.slotLayout = "contiguous"
*.queue.lambdaPerMs = ${lambdaPerMs=1.175827370643,1.258426609238,1.332922484076}

[Config Round2_Deterministic_D6]
repeat = 5
seed-set = ${repetition}
*.queue.D = 6
*.queue.r = 30
*.queue.slotLayout = "contiguous"
*.queue.lambdaPerMs = ${lambdaPerMs=0.392955259762,0.419726949589,0.444344681023}

