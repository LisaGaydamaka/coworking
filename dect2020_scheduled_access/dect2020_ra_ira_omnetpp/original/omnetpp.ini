[General]
network = Cluster
sim-time-limit = 3000s
seed-set = 1

# Один кластер: два PT и один FT (как D1=2 в ВКР)
Cluster.numPTs = 2
Cluster.arrProb = 0.01

# 1 единица модельного времени = 1 символ.
# Значения совпадают с Python-симулятором.
Cluster.transTime = 10s
Cluster.procTime = 10s
Cluster.ackTime = 5s
Cluster.lbtTime = 2s
# ackTimeout рассчитан в Cluster.ned как transTime+procTime+ackTime+1s

# Параметры backoff
Cluster.cMin = 1
Cluster.cMax = 16

**.scalar-recording = true
**.vector-recording = false