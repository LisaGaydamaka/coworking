[General]

network = DectRandomAccess
simtime-resolution = ps
cmdenv-express-mode = true
seed-set = 0

*.model.cMin = 5
*.model.cMax = 40

*.model.ptCount = 2
*.model.generationIntervalSymbols = 500
*.model.resetBackoffAfterNoAck = false

*.model.dataSymbols = 10
*.model.procSymbols = 10
*.model.ackSymbols = 5

*.model.symbolTime = 41.666666667us
*.model.simulationSymbols = 100000
*.model.warmupSymbols = 0


*.model.lbtSymbols = 2

**.vector-recording = false

[Config Quick]
description = "two PT"

[Config SinglePt]
description = "PT"
*.model.ptCount = 1
*.model.cMin = 0
*.model.cMax = 0

[Config CollisionDemo]
description = "2 PTs, zero backoff"
*.model.ptCount = 2
*.model.generationIntervalSymbols = 1
*.model.cMin = 0
*.model.cMax = 0
*.model.simulationSymbols = 1000

[Config VkrD500]
description = "D=2, d=500, Cmin=5, Cmax=40"
*.model.ptCount = 2
*.model.generationIntervalSymbols = 500
*.model.cMin = 5
*.model.cMax = 40
*.model.simulationSymbols = 2000000

[Config VkrD250]
description = "D=2, d=250, Cmin=5, Cmax=40"
*.model.ptCount = 2
*.model.generationIntervalSymbols = 250
*.model.cMin = 5
*.model.cMax = 40
*.model.simulationSymbols = 2000000

[Config VkrDSweep]
description = "d=110..390, D=2, Cmin=5, Cmax=40"
*.model.ptCount = 2
*.model.generationIntervalSymbols = ${d=110..390 step 10}
*.model.cMin = 5
*.model.cMax = 40
*.model.simulationSymbols = 2000000
output-scalar-file = "results/d-sweep/${configname}-${runnumber}.sca"

