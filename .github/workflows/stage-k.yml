name: Stage K final subset decision

on:
  push:
    branches: [main]
    paths:
      - 'mouse_neuroplasticity_enri/enri_mouse_neuroplasticity_feature_selection/stage_k.trigger'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-k:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: mouse_neuroplasticity_enri/enri_mouse_neuroplasticity/requirements.txt
      - name: Install dependencies
        working-directory: mouse_neuroplasticity_enri/enri_mouse_neuroplasticity_feature_selection
        run: pip install -r ../enri_mouse_neuroplasticity/requirements.txt
      - name: Run Stage K
        working-directory: mouse_neuroplasticity_enri/enri_mouse_neuroplasticity_feature_selection
        run: python stage_k.py
      - name: Commit Stage K outputs
        shell: bash
        run: |
          DIR="mouse_neuroplasticity_enri/enri_mouse_neuroplasticity_feature_selection/stage_k"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Run Stage K final subset decision"
            git reset --hard HEAD
            git clean -fd
            git pull --rebase origin main
            git push
          fi
